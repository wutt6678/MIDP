# Qwen3.5-0.8B on CelebA (huggan mirror): zero-shot Yes/No classification of the
# 40 CelebA attributes.
#
# Qwen3.5-0.8B is a native multimodal dense model (Qwen3_5ForConditionalGeneration,
# 24 layers, ~2 GB bf16) that fits comfortably on one GPU.
#
# Qwen3.5 thinks by default; the `qwen` adapter disables thinking so the first
# generated token is the Yes/No answer used for logit scoring.
#
# Requires the `midp_qwen` env (transformers >= 5.5, see setup_qwen_env.sh).
model:
  adapter: qwen
  model_id: Qwen/Qwen3.5-0.8B
  dtype: bfloat16
  device_map: cuda:0          # override with CUDA_VISIBLE_DEVICES to pick a GPU

dataset:
  adapter: celeba_huggan
  dataset_id: huggan/CelebA-faces-with-attributes
  split: train
  image_column: image
  attributes: null             # null = all 40 CelebA attributes
  label_style: pm1             # CelebA convention: -1 = absent, +1 = present

eval:
  limit: 500                   # 0 = all images (~185k, very slow)
  seed: 0
  batch_size: 4
  question_template: 'Look at the face in this image. Does the person have "{attr}"? Answer with Yes or No.'

output:
  dir: results
