[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "route-unlearning-data"
version = "0.1.0"
description = "CelebA-40 evaluation and multimodal-unlearning dataset construction for rerouting-aware unlearning experiments."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.14.0,<5.15",
    "accelerate",
    "datasets",
    "huggingface_hub",
    "pillow",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
quant = ["bitsandbytes"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
route-data = "route_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ignore non-critical rules that require runtime behavior changes
ignore = [
    "BLE001",     # Do not catch blind exception (requires context-specific handling)
    "EXE001",     # Shebang is present but file is not executable (CI handles this)
    "S110",       # `except Exception` (acceptable for error handling in scripts)
    "S112",       # `except Exception` with try-except-except (acceptable pattern)
]

[tool.ruff.lint.per-file-ignores]
# Test files can use dict() constructors and unused imports
"tests/unit/test_conflict_probes.py" = ["C408"]
"tests/unit/test_p1_fixes.py" = ["C408", "RUF015", "F841"]
"tests/unit/test_p2_fixes.py" = ["F401"]
"tests/unit/test_r8_r20_fixes.py" = ["C408", "RUF012", "PLW1510", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
