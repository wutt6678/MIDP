# Full FIUBench annotation with Qwen3.5-9B.
# Processes all 572 identity records (573 unique images × 40 CelebA attributes
# = 22,920 unique queries) without smoke-manifest filtering.
#
# Usage:
#   export FIUBENCH_ROOT=/scratch/wutiantong/datasets/FIUBench
#   CUDA_VISIBLE_DEVICES=1 PYTHONPATH=src python -m route_data.cli build annotate \
#       --dataset fiubench \
#       --config configs/runs/full_fiubench_qwen.yaml
#
run:
  name: full_fiubench_qwen
  model_role: annotator
  seed: 17

model:
  backend: qwen_hf
  model_id: Qwen/Qwen3.5-9B
  revision: null
  processor_id: null
  trust_remote_code: false
  dtype: bfloat16
  device_map: "cuda:0"
  attn_implementation: sdpa
  quantization:
    enabled: false
  generation:
    do_sample: false
    temperature: 0.0
    max_new_tokens: 8
  batch_size: 1
  seed: 17

data:
  name: fiubench
  root: ${FIUBENCH_ROOT}
  source_version: "fiubench-8e12cdd"
  compute_checksums: false
  data_config_path: configs/data/fiubench.yaml

prompts:
  binary: configs/prompts/celeba_binary_v1.yaml
  grouped: configs/prompts/celeba_grouped_json_v1.yaml
  route_conflict: configs/prompts/route_conflict_v1.yaml

thresholds: configs/thresholds/celeba_default.yaml

frozen_protocol:
  prompts_version: celeba_binary_v1
  scoring: candidate
  calibrators: null

build:
  datasets: [fiubench]
  output_dir: outputs/full_fiubench
  confidence_bands:
    high: 0.85
    medium: 0.60
  min_auto_accept_score: 0.85
  qa_registry_hash: null
