# CelebA pilot run: coverage + prompt-stability/calibration pilots.
run:
  name: celeba_pilot
  model_role: evaluator              # evaluator | annotator | unlearning_target
  seed: 17

model:
  backend: mllama_hf
  model_id: meta-llama/Llama-3.2-11B-Vision-Instruct
  revision: null
  processor_id: null
  trust_remote_code: false
  dtype: bfloat16
  device_map: auto
  attn_implementation: sdpa
  quantization:
    enabled: true
    mode: nf4
    compute_dtype: bfloat16
    double_quant: true
  generation:
    do_sample: false
    temperature: 0.0
    max_new_tokens: 4
  batch_size: 4
  seed: 17

data:
  name: celeba
  root: ${CELEBA_ROOT}
  image_dir: img_align_celeba
  attr_file: list_attr_celeba.txt
  partition_file: list_eval_partition.txt
  identity_file: identity_CelebA.txt
  landmarks_file: list_landmarks_align_celeba.txt
  source_version: "celeba-2015-original"
  image_probe_count: 32
  image_probe_seed: 17
  compute_checksums: true

prompts:
  binary: configs/prompts/celeba_binary_v1.yaml
  grouped: configs/prompts/celeba_grouped_json_v1.yaml
  route_conflict: configs/prompts/route_conflict_v1.yaml

thresholds: configs/thresholds/celeba_default.yaml

evaluation:
  mode: single_attribute             # single_attribute (Mode A) | grouped_json (Mode B)
  scoring: candidate                 # generation | candidate (candidate preferred
                                     # for AUROC/calibration)
  attributes: all                    # or an explicit list for pilots
  manifest: null                     # e.g. celeba_pilot_400.parquet (relative to
                                     # data/manifests)
  split: validation
  resume: true
  output_dir: outputs/predictions
