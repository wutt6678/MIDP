# Extension build run: normalize benchmarks, annotate with the frozen CelebA
# protocol, generate QA / route probes / splits, and export.
run:
  name: build_all_extensions
  model_role: annotator              # model outputs become WEAK labels only
  seed: 17

model:
  backend: mllama_hf
  model_id: meta-llama/Llama-3.2-11B-Vision-Instruct
  revision: null
  processor_id: null
  trust_remote_code: false
  dtype: bfloat16
  device_map: auto
  attn_implementation: sdpa
  quantization:
    enabled: true
    mode: nf4
    compute_dtype: bfloat16
    double_quant: true
  generation:
    do_sample: false
    temperature: 0.0
    max_new_tokens: 4
  batch_size: 4
  seed: 17

data:
  name: celeba                       # frozen-protocol source
  root: ${CELEBA_ROOT}
  image_dir: img_align_celeba
  attr_file: list_attr_celeba.txt
  partition_file: list_eval_partition.txt
  identity_file: identity_CelebA.txt
  landmarks_file: list_landmarks_align_celeba.txt
  source_version: "celeba-2015-original"
  image_probe_count: 32
  image_probe_seed: 17
  compute_checksums: true

prompts:
  binary: configs/prompts/celeba_binary_v1.yaml
  grouped: configs/prompts/celeba_grouped_json_v1.yaml
  route_conflict: configs/prompts/route_conflict_v1.yaml

thresholds: configs/thresholds/celeba_default.yaml

# Frozen protocol used for all benchmark annotation (set by freeze-protocol).
frozen_protocol:
  prompts_version: celeba_binary_v1
  scoring: candidate
  calibrators: null                  # outputs/.../calibrators.json after freeze

build:
  datasets: [fairget, fiubench, mllmu, ppubench]
  output_dir: data/processed
  confidence_bands:
    high: 0.85
    medium: 0.60
  # Minimum calibrated agreement before an attribute is auto-accepted.
  min_auto_accept_score: 0.85
  qa_registry_hash: null             # filled at build time from template registry
