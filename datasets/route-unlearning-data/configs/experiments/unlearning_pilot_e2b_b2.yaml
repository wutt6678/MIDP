# Stage 3 — E2B-B2: Stronger Retention Weight
#
# E2B-B1b result (lr=2e-5, retain_weight=0.1): Same global collapse,
# delayed to steps 60-90. LR controls rate, not selectivity.
# Three experiments confirm route-family coupling persists at every LR.
#
# E2B-B2 hypothesis: retain_weight=1.0 (10× increase) may produce
# qualitatively different behavior:
#   A. Everything preserved (retain term dominates, targets survive too)
#   B. Everything still moves together, just more slowly
#
# Changes from E2B-B1b:
#   - retain_weight: 0.1 → 1.0
#   - checkpoint_steps: focused around previously observed transition
#     [0, 25, 50, 60, 75, 90, 125]
#
# Everything else fixed: lr=2e-5, seed 17, rank 8, alpha 16,
# 2/2/2 identities, 125 steps

