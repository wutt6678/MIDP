# Stage 3 — E2B-B1b: Lower Learning Rate (2e-5)
#
# E2B-B1 result (lr=5e-5): Collapse delayed from steps 10-25 to steps 35-50.
# Step 35 showed genuine DV selectivity (target DV=0.0, retain DV=1.0)
# but overall still Outcome B — global collapse by step 50.
#
# E2B-B1b hypothesis: At lr=2e-5, optimization scale is ~2.5× slower.
# If LR×steps ≈ constant for the critical transition, it should move
# to roughly steps 60-125. We extend the trajectory past 50 steps
# to locate it.
#
# Two-phase checkpoint schedule (single continuous trajectory):
#   Phase 1 (steps 1-50):  strict controlled comparison with E2B-B1
#   Phase 2 (steps 60-125): extend to find the transition
#
# Changes from E2B-B1:
#   - learning_rate: 5.0e-5 → 2.0e-5
#   - num_optimizer_steps: 50 → 125
#   - checkpoint_steps: extended to [0,1,5,10,15,20,25,35,50,60,75,90,105,125]
#
# Everything else fixed: seed 17, 2/2/2 identities, retain_weight=0.1

