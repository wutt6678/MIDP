# Stage 3 — E2B-B1: Lower Learning Rate (5e-5)
#
# E1 Outcome B: Target effect exists but preservation catastrophically failed.
# All groups degraded to 0% accuracy by step 25.
# Checkpoint trajectory analysis showed no selective window at lr=1e-4.
#
# E2B-B1 hypothesis: Lower LR creates wider window between "margin starts
# decreasing" and "total collapse," potentially allowing selective target
# forgetting before retain/control follow.
#
# Changes from E1:
#   - learning_rate: 1.0e-4 → 5.0e-5
#   - checkpoint_steps: [0, 1, 5, 10, 15, 20, 25, 35, 50] (finer-grained)
#
# Everything else fixed: seed 17, 2/2/2 identities, 50 steps, retain_weight=0.1

