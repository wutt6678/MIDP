# MLLMU-Bench Baselines — Common Configuration
#
# Shared settings for all baseline methods (B0–B6).
# Per-method configs inherit these defaults and override method-specific
# hyperparameters.
#
# Controlled experiment: same model, same LoRA, same seed, same data.

base_model:
  id: Qwen/Qwen3.5-9B
  revision: "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
  dtype: bfloat16
  backend: qwen_hf

training:
  seed: 17
  learning_rate: 2.0e-5
  max_optimizer_steps: 125
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  warmup_steps: 0
  checkpoint_steps: [1, 5, 10, 25, 50, 60, 75, 90, 125]

lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, v_proj, k_proj, o_proj]

data:
  # Identity counts: 2 target / 2 retain / 2 control (match E2B)
  target_identity_count: 2
  retain_identity_count: 2
  control_identity_count: 2
  # Identity IDs from E2B
  forget_identity_ids:
    - "2c1fad4cae23251c"
    - "a3fce824eb38f618"
  retain_identity_ids:
    - "4a7c949dbe59693d"
    - "cbb9f0b7b65140bd"
  control_identity_ids:
    - "79e55019b5576f88"
    - "81b95673fc82fe47"
  # Dataset path
  processed_dataset_path: outputs/full_fiubench/Qwen_Qwen3.5-9B/fiubench/fiubench_processed.jsonl
  processed_dataset_sha256: "7200df4ec361ee52ad8a183b1181271980f35fb3f79690931f17481080c0d8c1"
  # Frozen 500-probe evaluation dataset (must match E2B probe path)
  route_probe_path: outputs/full_fiubench/Qwen_Qwen3.5-9B/fiubench/fiubench_route_conflict_eval.jsonl
  route_probe_sha256: "aeca4ee889e429ad717afb4d83c265b3990aebd5c1464b8afb4b4a2ad4dfd864"
  # Selection manifest (identity assignment provenance)
  selection_manifest_path: outputs/experiments/unlearning_pilot/Qwen_Qwen3.5-9B/pilot_v1/selection/pilot_identity_selection.json
  selection_manifest_sha256: "a7ff1fceb715fb30b34809d98eb6e7e25a4a21a88a8b188c024d124b49b19655"
  # Research dataset manifest and freeze verification
  research_dataset_manifest_path: outputs/full_fiubench/evidence/research_dataset_manifest.json
  research_dataset_manifest_sha256: "172eb141bf1e80b463bf433a7c1795c560be03facd72d27bcd05bfd5a75256ec"
  freeze_verification_path: outputs/full_fiubench/evidence/final_freeze_verification.json
  freeze_verification_sha256: "ade4c13faef460fdb698f6577a2a07f8d79385dd7013cd88dc3ad6d3180fdae1"
  # Pre-unlearning baseline binding (P0-16)
  baseline_results_path: outputs/experiments/pre_unlearning/Qwen_Qwen3.5-9B/baseline_v1/baseline_results.jsonl
  baseline_results_sha256: "b3d497877fcfe1f4020cf7e751bbd4c0991064d2a67b0fd622090f487311cd50"
  baseline_manifest_path: outputs/experiments/pre_unlearning/Qwen_Qwen3.5-9B/baseline_v1/baseline_manifest.json
  baseline_manifest_sha256: "d3366acb45851e5107ce91f408b51767e5f548f385a1269ffb61fbdab6413908"

evaluation:
  reuse_frozen_500_probes: true
  primary_metric: signed_answer_margin
  preserve_visual_capability: true
  direct_visual_accuracy_gate: 0.98
