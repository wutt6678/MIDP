# Stage 3 — Phi-4-MM Unlearning Experiment (v1)
#
# This config defines the unlearning experiment for Phi-4-multimodal-instruct.
# Goal: Selectively alter behaviour associated with specific identities
#       while preserving general visual capability.
#
# Scale:  2 target identities (+ matched retain & control)
# Method: LoRA-based targeted candidate margin
# Seed:   17
#
# Baseline: phi4_mm smoke_v1 (50 probes, balanced 10/family)

experiment_id: fiubench_unlearning_phi4mm_v1

base_model:
  model_id: microsoft/Phi-4-multimodal-instruct
  revision: "93f923e1a7727d1c4f446756212d9d3e8fcc5d81"
  processor_revision: "93f923e1a7727d1c4f446756212d9d3e8fcc5d81"
  backend: adapter_eval_backend
  dtype: bfloat16
  fingerprint_id: "78b6e03c62fbab30"
  model_config_path: configs/models/unlearning/phi4_mm.yaml

baseline:
  model_key: phi4_mm
  protocol_version: smoke_v1
  results_path: outputs/experiments/pre_unlearning/phi4_mm/smoke_v1/baseline_results.jsonl

dataset:
  route_probe_path: outputs/full_fiubench/Qwen_Qwen3.5-9B/fiubench/fiubench_route_conflict_eval.jsonl
  route_probe_sha256: aeca4ee889e429ad717afb4d83c265b3990aebd5c1464b8afb4b4a2ad4dfd864
  processed_dataset_path: outputs/full_fiubench/Qwen_Qwen3.5-9B/fiubench/fiubench_processed.jsonl
  research_manifest_path: outputs/full_fiubench/evidence/research_dataset_manifest.json
  freeze_verification_path: outputs/full_fiubench/evidence/final_freeze_verification.json

selection:
  target_identity_count: 2
  retain_identity_count: 2
  control_identity_count: 2
  seed: 17
  matching_criteria:
    - same-protocol-role
    - baseline-margin-matched
    - attribute-diverse-retain-control
  preferred_role: train

method:
  name: lora_targeted_candidate_margin
  hyperparameters:
    lora_rank: 8
    lora_alpha: 16
    lora_dropout: 0.05
    learning_rate: 1.0e-4
    num_optimizer_steps: 50
    retain_weight: 0.1
    train_batch_size: 1
    gradient_accumulation_steps: 4

evaluation:
  reuse_frozen_500_probes: true
  primary_metric: signed_answer_margin
  preserve_visual_capability: true
  direct_visual_accuracy_gate: 0.98
  generation_config:
    binary_families:
      do_sample: false
      temperature: 0.0
      max_new_tokens: 4
    name_only:
      do_sample: false
      temperature: 0.0
      max_new_tokens: 128

runtime:
  seed: 17
  output_dir: outputs/experiments/unlearning/phi4_mm/canary_v1
  device: cuda:0
  training_mode: true
