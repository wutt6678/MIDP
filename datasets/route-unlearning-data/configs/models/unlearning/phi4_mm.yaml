# Model profile: Phi-4-multimodal-instruct (independent replication)
# Priority: 3 — inexpensive independent replication
key: phi4_mm

model:
  id: microsoft/Phi-4-multimodal-instruct
  revision: "93f923e1a7727d1c4f446756212d9d3e8fcc5d81"
  processor_id: microsoft/Phi-4-multimodal-instruct
  processor_revision: "93f923e1a7727d1c4f446756212d9d3e8fcc5d81"
  adapter: phi4mm
  trust_remote_code: true
  dtype: bfloat16
  attn_implementation: eager  # requires SDPA shim (no flash_attn available)

candidate_protocol:
  positive: "Yes"
  negative: "No"

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  scope: language_attention_only
  # Phi uses fused qkv_proj + o_proj (NOT separate q/k/v).
  # IMPORTANT: Do NOT include .base_layer — Phi wraps these in PEFT LoraLayer
  # for vision/speech; targeting the LoraLayer name triggers update_layer().
  scope_regex: "^model\\.layers\\.\\d+\\.(self_attn)\\.(qkv_proj|o_proj)$"

structural:
  language_layer_path: "model.layers"
  language_hidden_size: 3072
  intermediate_size: 8192
  num_language_layers: 32
  r2mu_candidate_layers: [8, 16, 24, 30]
  r2mu_n_select_layers: 4
  # Phi uses fused gate_up_proj + down_proj MLP
  manu_spec: phi4mm_language_mlp_v1

# Phi multimodal fields:
# input_image_embeds, image_attention_mask, image_sizes, input_mode
# Image token: <|endoftext10|> (ID 200010)

compatibility:
  min_transformers: "4.47.0"
  tested_transformers: "4.48.3"
  # REQUIRES: transformers 4.47.x + SDPA monkey-patches
  # (PreTrainedModel._check_and_enable_flash_attn_2 noop,
  #  modeling_flash_attention_utils._flash_attention_forward -> SDPA,
  #  vision_siglip_navit.SiglipFlashAttention2._flash_attention_forward -> SDPA)

access:
  requires_hf_auth: false

supports_prompting: false
supports_candidate_margin: false
supports_ga: false
supports_gd: false
supports_kl: false
supports_npo: false
supports_mmunlearner: false
supports_manu: false
supports_r2mu: false

status:
  implementation: discovery_complete
  research_ready: false
