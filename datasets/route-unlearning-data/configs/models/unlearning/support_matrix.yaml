# Multi-model support matrix for MIDP unlearning pipeline.
#
# A model reaches M1 (core) support only when all fine-tuning paths
# work: pre-baseline, Prompting, candidate-margin, GA, GD, KL, NPO oracle,
# NPO, LoRA save/reload, common post-evaluation.
#
# A model reaches M2 (structural) support only when additionally:
# MMUnlearner, MANU 5%/10%, R²MU-adapted all pass.
#
# Only flip flags after the corresponding acceptance evidence exists.
# Fail closed for unsupported methods.

