# Target model for FIUBench unlearning experiments.
# This is the same Qwen3.5-9B used for annotation, pinned to the exact
# revision used in the frozen dataset (fiubench-route-v1).
#
# The annotation model and the unlearning target are the same model.
# Any post-annotation fine-tuning or unlearning starts from this checkpoint.
#
# Usage:
#   route-data experiment baseline \
#       --dataset fiubench \
#       --config configs/runs/full_fiubench_qwen.yaml \
#       --model-config configs/models/unlearning_target_qwen35_9b.yaml \
#       --output-dir outputs/experiments/baseline
#
model:
  backend: qwen_hf
  model_id: Qwen/Qwen3.5-9B
  revision: "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
  processor_id: null
  trust_remote_code: false
  dtype: bfloat16
  device_map: "cuda:0"
  attn_implementation: sdpa
  quantization:
    enabled: false
    mode: nf4
    compute_dtype: bfloat16
    double_quant: true
  generation:
    do_sample: false
    temperature: 0.0
    max_new_tokens: 8
  batch_size: 1
  seed: 17
