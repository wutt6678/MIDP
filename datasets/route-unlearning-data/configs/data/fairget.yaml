# FAIRGET source configuration.
# Paper: https://arxiv.org/abs/2607.21300
# Repo:  https://github.com/lorenzoorsingher/unlearning-under-imbalance
# 4,000 fictitious identities, 40,000 images, >225,000 QA pairs, FairFace-based
# visual demographic annotations, ten identity-linked textual attributes.
data:
  name: fairget
  # Prefer a local checkout of the official repository/HF dataset.
  hf_dataset_id: null                # e.g. org/fairget (set if using HF hub)
  hf_config_name: null
  hf_revision: fairget-2026.07       # pin the upstream commit when mirroring
  local_root: ${FAIRGET_ROOT}
  # Pinned source revision recorded on every canonical record (repair plan
  # C1). Must never be null or "unknown" at runtime; replace with the exact
  # upstream commit hash when mirroring the real source.
  source_version: fairget-2026.07
  # Source-layout settings (repair plan C2) — the adapter reads the released
  # nested layout, not a guessed flat field map.
  source_file: data/dataset.json
  split_file: splits/official.json    # official unbalanced forget splits
  images_root: .                     # train_images/ and test_images/ live at root
  image_expansion_policy: all_views  # or hash_assigned
  view_assignment_seed: 17
  adapter_version: fairget-v2
  # Official unbalanced forget splits are reused, never regenerated.
  reuse_official_splits: true
  domain_shift_audit_images: 100
