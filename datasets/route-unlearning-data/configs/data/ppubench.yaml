# PPU-Bench source configuration.
# Repo:  https://github.com/guangjh/ppu-bench
# Card:  https://huggingface.co/datasets/closerG/ppu-bench
# Real public figures across several unlearning settings with text/image QA.
# Every run must pin dataset, configuration, split, and revision (repair plan
# B27); the adapter refuses to load without them.
data:
  name: ppubench
  hf_dataset_id: closerG/ppu-bench
  hf_config_name: ppu_eval_classification
  hf_split: test
  hf_revision: ppu-bench-1.0         # pin the HF dataset revision when mirroring
  local_root: ${PPUBENCH_ROOT}       # optional cache dir
  # Pinned source revision (repair plan C1); replace with the exact HF
  # dataset revision when mirroring the real source.
  source_version: ppu-bench-1.0
  # R10: immutable source revision components. Replace PENDING values with
  # exact HF revision SHA before pilot/full generation.
  immutable_revision:
    hf_dataset_id: closerG/ppu-bench   # HF dataset ID
    hf_config: ppu_eval_classification # HF configuration name
    hf_split: test                     # HF split
    hf_revision_sha: PENDING           # exact HF revision SHA
  # Source-layout settings (repair plan C2). Released rows carry sample_id,
  # subject_id, subject, task_type, modality, question, answer_text,
  # answer_label, option_a..option_d and image/image_NNN columns (B28/B30).
  source_file: data/ppu_eval_classification.jsonl
  images_root: .
  adapter_version: ppubench-v2
  # Fields preserved verbatim in source_metadata on every canonical record.
  preserve_fields:
    - hf_config_name
    - source_split
    - task_type
    - modality
    - subject_id
    - question
    - answer_label
    - options
    - image_field
  domain_shift_audit_images: 100
