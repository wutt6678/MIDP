# FIUBench source configuration.
# Paper: https://arxiv.org/abs/2411.03554
# Repo:  https://github.com/SaFo-Lab/FIUBench
#
# Architecture: Option A — consume released FIUBench files directly.
#   dataset/full.json   → JSONL, one record per identity (572 records)
#   dataset/split.json  → JSON object mapping bucket → [subject_ids]
#
# Released split vocabulary: forget1, forget5, forget10, retain5, retain15.
# retain5 ⊂ retain15 (overlapping); forget buckets are NOT nested.
data:
  name: fiubench
  hf_dataset_id: null
  hf_config_name: null
  hf_revision: fiubench-1.0
  local_root: ${FIUBENCH_ROOT}
  source_version: fiubench-8e12cdd
  # R10 / P0-2 / P0-13: path-bound immutable hashes (not positional).
  immutable_revision:
    git_commit_sha: 8e12cddc431eafd129c275d46a3d882474cfcf61
    files:
      dataset/full.json:
        sha256: f2f04cf7e21a3170b4c1541b5e650c9db3f92ff6f7833ea3f9e19887787bff72
      dataset/split.json:
        sha256: f576e63909babf5105f004b2230154a4d46e6b37160d7554c3434b6693a7ce4c
  # Released source files (P0-2).
  source_file: dataset/full.json
  split_file: dataset/split.json
  images_root: .
  include_paraphrases: true          # qa_list paraphrased variants (B15)
  include_perturbed: true            # qa_list perturbed variants (B15)
  adapter_version: fiubench-v3
  reuse_official_splits: true
  include_attack_templates: true
  domain_shift_audit_images: 100
  # P0-3: FIUBench experiment protocol — maps released buckets to MIDP roles.
  # The fiubench_protocol block is the SOLE authority for experiment roles.
  # Do NOT add generic source_mapping entries for released buckets; the
  # protocol resolution handles all role assignment (P0-1).
  #
  # forget_bucket: the deletion condition (identities to forget).
  # train_bucket: the retention pool (identities to keep for training).
  # eval_bucket: identities reserved for evaluation (null = use holdout).
  # P1-2: first smoke uses forget10 / retain15 with deterministic holdout.
  extras:
    fiubench_protocol:
      name: fiubench_midp_all572_v1
      source_population:
        mode: all
      forget_bucket: forget10
      train_bucket: retain15
      eval_bucket: null              # null → deterministic holdout from train_bucket
      eval_fraction: 0.20
      eval_seed: 17
    # Released bucket vocabulary (documentation only — the protocol above
    # is the sole authority for role assignment).
    released_buckets:
      - forget1
      - forget5
      - forget10
      - retain5
      - retain15
    # Legacy source_mapping kept ONLY for golden CI fixture compatibility
    # (which uses forget/retain/evaluation bucket names without a protocol).
    source_mapping:
      forget: exclude
      retain: train
  multiview:
    enabled: false                   # fiubench_multiview is opt-in and versioned
    images_per_identity: [5, 10]
