name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install pytest pyyaml Pillow
          # Install the package in development mode if setup.py/pyproject.toml exists
          pip install -e . 2>/dev/null || true

      - name: Run unit tests
        working-directory: datasets/route-unlearning-data
        run: |
          python -m pytest tests/unit/ -v --tb=short

      - name: Run golden e2e tests
        working-directory: datasets/route-unlearning-data
        run: |
          python -m pytest tests/golden/ -v --tb=short

      - name: Run integration tests
        working-directory: datasets/route-unlearning-data
        run: |
          python -m pytest tests/integration/ -v --tb=short

      - name: Run final verification script
        working-directory: datasets/route-unlearning-data
        run: |
          python scripts/final_verify.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile datasets/route-unlearning-data/src/route_data/cli.py
          python -m py_compile datasets/route-unlearning-data/src/route_data/build/export.py
          python -m py_compile datasets/route-unlearning-data/src/route_data/build/conflict_generation.py
          python -m py_compile datasets/route-unlearning-data/src/route_data/build/split_generation.py
          python -m py_compile datasets/route-unlearning-data/scripts/final_verify.py
