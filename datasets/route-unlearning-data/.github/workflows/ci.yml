name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for SHA verification
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Record git provenance
      run: |
        echo "Commit SHA: $(git rev-parse HEAD)"
        echo "Short SHA: $(git rev-parse --short HEAD)"
        echo "Dirty state: $(git status --porcelain | wc -l) uncommitted changes"
        git rev-parse HEAD > .git_commit_sha
        git status --porcelain > .git_status || true
    
    - name: Run ruff lint
      run: |
        ruff check .
    
    - name: Run pytest
      run: |
        pytest tests/ -v --tb=short
    
    - name: Verify git cleanliness
      run: |
        # Ensure no uncommitted changes after tests
        if [ -n "$(git status --porcelain)" ]; then
          echo "ERROR: Working tree not clean after tests"
          git status --porcelain
          exit 1
        fi
        echo "✓ Git working tree clean"
    
    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          .git_commit_sha
          .git_status
          .pytest_cache/
        retention-days: 7
